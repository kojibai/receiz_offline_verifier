<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" shape-rendering="geometricPrecision">
  <rect x="8" y="8" width="112" height="112" rx="14" stroke="#000" stroke-width="4"/>
  <path d="M32 44h64" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 64h64" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 84h44" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Receiz mark replaces dot at (92,84) -->
  <!-- scale(0.25) => 16x16; translate = (92 - 32*s, 84 - 32*s) = (84, 76) -->
  <g transform="translate(84 76) scale(0.25)" role="img" aria-label="Receiz">
    <rect x="6" y="6" width="52" height="52" rx="14" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <text
      x="32"
      y="40"
      text-anchor="middle"
      font-family="Iowan Old Style, Palatino Linotype, Times New Roman, serif"
      font-size="28"
      font-weight="700"
      fill="#111111"
      letter-spacing="1"
    >R</text>
  </g>
</svg>